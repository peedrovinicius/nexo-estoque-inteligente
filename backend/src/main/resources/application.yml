server:
  port: ${PORT:8080}

spring:
  application:
    name: nexo-estoque-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nexo_estoque?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initialization-fail-timeout: -1
      connection-timeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health

nexo:
  db:
    bootstrap: ${NEXO_DB_BOOTSTRAP:true}
    demo-seed: ${NEXO_DEMO_SEED:false}
  cors:
    allowed-origins: ${NEXO_CORS_ALLOWED_ORIGINS:https://nexo-estoque-web-production.up.railway.app,http://localhost:5173}
  auth:
    admin-user: ${NEXO_ADMIN_USER:admin}
    admin-password: ${NEXO_ADMIN_PASSWORD:}
    operator-user: ${NEXO_OPERATOR_USER:operador}
    operator-password: ${NEXO_OPERATOR_PASSWORD:}
    demo-user: ${NEXO_DEMO_USER:demo}
    demo-password: ${NEXO_DEMO_PASSWORD:Nexo@2026}
  ai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-luna}
