name: E2E Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/br/com/nexoestoque/config/**'
      - 'backend/src/main/java/br/com/nexoestoque/controller/AuthController.java'
      - 'backend/src/main/java/br/com/nexoestoque/service/AuthSessionService.java'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/src/main/java/br/com/nexoestoque/config/**'
      - 'backend/src/main/java/br/com/nexoestoque/controller/AuthController.java'
      - 'backend/src/main/java/br/com/nexoestoque/service/AuthSessionService.java'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '17 7 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright runner
        run: npm install --no-save @playwright/test@1.63.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build pull request preview
        if: github.event_name == 'pull_request'
        run: npm run build
      - name: Start pull request preview
        if: github.event_name == 'pull_request'
        run: |
          nohup npm run preview -- --host localhost --port 5173 > /tmp/nexo-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://localhost:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nexo-preview.log
          exit 1
      - name: Wait for Render Free API and MySQL to be ready
        run: |
          for attempt in {1..24}; do
            response="$(curl -fsS --max-time 25 https://nexo-estoque-api.onrender.com/api/v1/system/readiness 2>/dev/null || true)"
            if printf '%s' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); sys.exit(0 if data.get("api") == "ready" and data.get("database") == "ready" else 1)' 2>/dev/null; then
              echo "Nexo API and MySQL are ready."
              exit 0
            fi
            echo "API or MySQL not ready (attempt $attempt/24)."
            sleep 10
          done
          echo "Nexo API or MySQL did not become ready in time."
          exit 1
      - name: Run browser smoke test
        env:
          NEXO_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://localhost:5173' || 'https://nexo-estoque-web.onrender.com' }}
        run: npx playwright test e2e/home.spec.ts --reporter=line
