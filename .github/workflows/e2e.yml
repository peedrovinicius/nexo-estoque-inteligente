name: E2E Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '17 7 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install application dependencies
        run: npm ci
      - name: Install Playwright runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production smoke test
        env:
          NEXO_BASE_URL: https://nexo-estoque-web-production.up.railway.app
        run: npx playwright test e2e/home.spec.ts --project=chromium --reporter=line
