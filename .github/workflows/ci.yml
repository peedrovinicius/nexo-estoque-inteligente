name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build

  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nexo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y default-mysql-client
      - name: Apply database migrations
        run: |
          mysql -h 127.0.0.1 -uroot -proot nexo_test < database/migrations/V1__baseline_schema.sql
          mysql -h 127.0.0.1 -uroot -proot nexo_test < database/migrations/V2__stock_idempotency.sql
          mysql -h 127.0.0.1 -uroot -proot nexo_test < database/migrations/V3__audit_history_and_indexes.sql
          mysql -h 127.0.0.1 -uroot -proot nexo_test < database/migrations/V4__purchasing_retention.sql
          mysql -h 127.0.0.1 -uroot -proot nexo_test < database/migrations/V5__warehouses_receipts_transfers.sql
          mysql -h 127.0.0.1 -uroot -proot nexo_test < database/migrations/V6__inventory_alert_settings.sql
          mysql -h 127.0.0.1 -uroot -proot nexo_test < database/migrations/V7__approvals_reservations.sql
          mysql -h 127.0.0.1 -uroot -proot nexo_test < database/migrations/V8__operational_governance.sql
          mysql -h 127.0.0.1 -uroot -proot nexo_test < database/migrations/V9__quality_recall_control.sql
          mysql -h 127.0.0.1 -uroot -proot nexo_test < database/migrations/R__procedures.sql
      - name: Verify warehouse receipt transfer and barcode integration
        env:
          NEXO_DB_INTEGRATION_URL: jdbc:mysql://127.0.0.1:3306/nexo_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          NEXO_DB_INTEGRATION_USER: root
          NEXO_DB_INTEGRATION_PASSWORD: root
        run: |
          cd backend
          mvn -B -Dtest=WarehouseFlowIntegrationTest test

      - name: Verify operational insights
        env:
          NEXO_DB_INTEGRATION_URL: jdbc:mysql://127.0.0.1:3306/nexo_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          NEXO_DB_INTEGRATION_USER: root
          NEXO_DB_INTEGRATION_PASSWORD: root
        run: |
          cd backend
          mvn -B -Dtest=OperationalInsightsIntegrationTest test

      - name: Verify inventory intelligence
        env:
          NEXO_DB_INTEGRATION_URL: jdbc:mysql://127.0.0.1:3306/nexo_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          NEXO_DB_INTEGRATION_USER: root
          NEXO_DB_INTEGRATION_PASSWORD: root
        run: |
          cd backend
          mvn -B -Dtest=InventoryIntelligenceIntegrationTest test

      - name: Verify traceability intelligence
        env:
          NEXO_DB_INTEGRATION_URL: jdbc:mysql://127.0.0.1:3306/nexo_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          NEXO_DB_INTEGRATION_USER: root
          NEXO_DB_INTEGRATION_PASSWORD: root
        run: |
          cd backend
          mvn -B -Dtest=TraceabilityIntelligenceIntegrationTest test

      - name: Verify action center
        env:
          NEXO_DB_INTEGRATION_URL: jdbc:mysql://127.0.0.1:3306/nexo_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          NEXO_DB_INTEGRATION_USER: root
          NEXO_DB_INTEGRATION_PASSWORD: root
        run: |
          cd backend
          mvn -B -Dtest=ActionCenterIntegrationTest test

      - name: Verify demand planning
        env:
          NEXO_DB_INTEGRATION_URL: jdbc:mysql://127.0.0.1:3306/nexo_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          NEXO_DB_INTEGRATION_USER: root
          NEXO_DB_INTEGRATION_PASSWORD: root
        run: |
          cd backend
          mvn -B -Dtest=DemandPlanningIntegrationTest test

      - name: Verify operational governance
        env:
          NEXO_DB_INTEGRATION_URL: jdbc:mysql://127.0.0.1:3306/nexo_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          NEXO_DB_INTEGRATION_USER: root
          NEXO_DB_INTEGRATION_PASSWORD: root
        run: |
          cd backend
          mvn -B -Dtest=OperationalGovernanceIntegrationTest test

      - name: Verify quality recall control
        env:
          NEXO_DB_INTEGRATION_URL: jdbc:mysql://127.0.0.1:3306/nexo_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          NEXO_DB_INTEGRATION_USER: root
          NEXO_DB_INTEGRATION_PASSWORD: root
        run: |
          cd backend
          mvn -B -Dtest=QualityControlIntegrationTest test

      - name: Verify idempotent stock write
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            INSERT INTO products(sku,name,category,current_stock,minimum_stock,active)
            VALUES('IDEM-001','Teste idempotência','Teste',0,0,TRUE);
          "
          PRODUCT_ID=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT id FROM products WHERE sku='IDEM-001';")

          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            CALL sp_stock_batch_entry($PRODUCT_ID,'LOT-IDEM',NULL,5,1,'ci','ci-idem-entry-001',@m,@b,@before,@after);
            CALL sp_stock_batch_entry($PRODUCT_ID,'LOT-IDEM',NULL,5,1,'ci','ci-idem-entry-001',@m2,@b2,@before2,@after2);
          "

          STOCK=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT current_stock FROM products WHERE id=$PRODUCT_ID;")
          MOVES=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT COUNT(*) FROM stock_movements WHERE product_id=$PRODUCT_ID AND movement_type='ENTRY';")

          test "$STOCK" = "5.000"
          test "$MOVES" = "1"
      - name: Verify product edit preserves stock and deactivation is controlled
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            INSERT INTO products(sku,name,category,current_stock,minimum_stock,active)
            VALUES('EDIT-001','Produto original','Teste',0,2,TRUE);
          "
          PRODUCT_ID=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT id FROM products WHERE sku='EDIT-001';")

          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            CALL sp_stock_batch_entry($PRODUCT_ID,'LOT-EDIT',NULL,4,2,'ci','ci-edit-stock-001',@m,@b,@before,@after);
            CALL sp_product_update($PRODUCT_ID,'EDIT-001','123456','Produto atualizado','Nova categoria',3,5,6);
          "

          STOCK=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT current_stock FROM products WHERE id=$PRODUCT_ID;")
          NAME=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT name FROM products WHERE id=$PRODUCT_ID;")
          test "$STOCK" = "4.000"
          test "$NAME" = "Produto atualizado"

          set +e
          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "CALL sp_product_set_active($PRODUCT_ID,FALSE);" >/tmp/deactivate-stock.log 2>&1
          BLOCK_CODE=$?
          set -e
          test "$BLOCK_CODE" -ne 0

          ACTIVE=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT active FROM products WHERE id=$PRODUCT_ID;")
          test "$ACTIVE" = "1"

          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            CALL sp_stock_exit_fefo($PRODUCT_ID,4,'ci','ci-edit-zero-001',@m,@before,@after);
            CALL sp_product_set_active($PRODUCT_ID,FALSE);
          "
          ACTIVE_AFTER=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT active FROM products WHERE id=$PRODUCT_ID;")
          test "$ACTIVE_AFTER" = "0"

      - name: Verify audit history actors decisions and indexes
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            INSERT INTO products(sku,name,category,current_stock,minimum_stock,active)
            VALUES('AUDIT-001','Produto auditado','Auditoria',0,0,TRUE);
          "
          PRODUCT_ID=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT id FROM products WHERE sku='AUDIT-001';")

          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            CALL sp_stock_batch_entry($PRODUCT_ID,'LOT-AUDIT',NULL,2,3,'ci','ci-audit-entry-001',@m,@b,@before,@after);
            UPDATE stock_movements SET performed_by='ci-operator' WHERE id=@m;
            INSERT INTO product_change_history(
              product_id, action_type, actor_username, before_snapshot, after_snapshot
            ) VALUES(
              $PRODUCT_ID,
              'UPDATE',
              'ci-admin',
              JSON_OBJECT('name','Produto auditado'),
              JSON_OBJECT('name','Produto auditado 2')
            );
            INSERT INTO decision_audit(
              product_id, decision_type, input_snapshot, output_snapshot, rule_version, actor_username
            ) VALUES(
              $PRODUCT_ID,
              'STOCK_SIMULATION',
              JSON_OBJECT('currentStock',2),
              JSON_OBJECT('riskLevel','BAIXO'),
              'simulation-v1.0.0',
              'ci-viewer'
            );
          "

          ACTOR=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT performed_by FROM stock_movements WHERE product_id=$PRODUCT_ID LIMIT 1;")
          HISTORY=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT COUNT(*) FROM product_change_history WHERE product_id=$PRODUCT_ID AND actor_username='ci-admin';")
          DECISIONS=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT COUNT(*) FROM decision_audit WHERE product_id=$PRODUCT_ID AND rule_version='simulation-v1.0.0' AND actor_username='ci-viewer';")
          INDEXES=$(mysql -N -h 127.0.0.1 -uroot -proot -e "
            SELECT COUNT(DISTINCT INDEX_NAME)
            FROM information_schema.statistics
            WHERE TABLE_SCHEMA='nexo_test'
              AND INDEX_NAME IN (
                'idx_products_active_name',
                'idx_products_category_active',
                'idx_stock_batches_fefo',
                'idx_stock_movements_product_created',
                'idx_stock_movements_created',
                'idx_blind_inventory_status_started',
                'idx_decision_audit_type_created',
                'idx_decision_audit_product_created',
                'idx_product_history_product_created'
              );
          ")

          test "$ACTOR" = "ci-operator"
          test "$HISTORY" = "1"
          test "$DECISIONS" = "1"
          test "$INDEXES" = "9"

      - name: Verify suppliers purchase orders retention and backup restore
        shell: bash
        run: |
          set -euo pipefail

          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            INSERT INTO suppliers(
              name,tax_id,contact_name,email,phone,lead_time_days,active
            ) VALUES(
              'Fornecedor CI','CI-123','Contato CI','ci@example.com','0000',4,TRUE
            );
          "
          SUPPLIER_ID=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT id FROM suppliers WHERE tax_id='CI-123';")

          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            INSERT INTO products(sku,name,category,current_stock,minimum_stock,active)
            VALUES('BUY-001','Produto compra','Compras',0,2,TRUE);
          "
          PRODUCT_ID=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT id FROM products WHERE sku='BUY-001';")

          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            INSERT INTO purchase_orders(
              supplier_id,status,source,rule_version,created_by,notes
            ) VALUES(
              $SUPPLIER_ID,'DRAFT','REPLENISHMENT_RECOMMENDATION','simulation-v1.0.0','ci-admin','CI'
            );
          "
          ORDER_ID=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT id FROM purchase_orders WHERE supplier_id=$SUPPLIER_ID ORDER BY id DESC LIMIT 1;")

          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            INSERT INTO purchase_order_items(
              purchase_order_id,product_id,quantity,unit_cost
            ) VALUES(
              $ORDER_ID,$PRODUCT_ID,12,5
            );

            CALL sp_stock_batch_entry(
              $PRODUCT_ID,'LOT-ARCHIVE',NULL,2,5,'ci archive',
              'ci-archive-entry-001',@m,@b,@before,@after
            );

            UPDATE stock_movements
               SET performed_by='ci-admin',
                   created_at='2020-01-01 00:00:00'
             WHERE id=@m;

            UPDATE stock_movement_allocations
               SET created_at='2020-01-01 00:00:00'
             WHERE movement_id=@m;

            CALL sp_archive_stock_movements(
              '2021-01-01 00:00:00',100,'ci-admin',@archived
            );
          "

          SUPPLIERS=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT COUNT(*) FROM suppliers WHERE id=$SUPPLIER_ID AND active=TRUE;")
          ORDERS=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT COUNT(*) FROM purchase_orders WHERE id=$ORDER_ID AND status='DRAFT';")
          ARCHIVED=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT COUNT(*) FROM stock_movements_archive WHERE idempotency_key='ci-archive-entry-001';")
          ARCH_ALLOC=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT COUNT(*) FROM stock_movement_allocations_archive WHERE original_movement_id=(SELECT original_movement_id FROM stock_movements_archive WHERE idempotency_key='ci-archive-entry-001');")
          RETENTION_RUNS=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT COUNT(*) FROM stock_retention_runs WHERE actor_username='ci-admin';")

          test "$SUPPLIERS" = "1"
          test "$ORDERS" = "1"
          test "$ARCHIVED" = "1"
          test "$ARCH_ALLOC" = "1"
          test "$RETENTION_RUNS" = "1"

          set +e
          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            CALL sp_stock_batch_entry(
              $PRODUCT_ID,'LOT-ARCHIVE',NULL,2,5,'retry',
              'ci-archive-entry-001',@m,@b,@before,@after
            );
          " >/tmp/archive-retry.log 2>&1
          RETRY_CODE=$?
          set -e
          test "$RETRY_CODE" -ne 0

          chmod +x scripts/db/backup.sh scripts/db/restore.sh
          rm -rf /tmp/nexo-backups
          DB_HOST=127.0.0.1           DB_PORT=3306           DB_NAME=nexo_test           DB_USER=root           DB_PASSWORD=root           OUT_DIR=/tmp/nexo-backups           scripts/db/backup.sh >/tmp/backup-path.txt

          BACKUP_FILE=$(cat /tmp/backup-path.txt)
          mysql -h 127.0.0.1 -uroot -proot -e "DROP DATABASE IF EXISTS nexo_restore_test; CREATE DATABASE nexo_restore_test;"

          CONFIRM_RESTORE=YES           DB_HOST=127.0.0.1           DB_PORT=3306           DB_NAME=nexo_restore_test           DB_USER=root           DB_PASSWORD=root           scripts/db/restore.sh "$BACKUP_FILE"

          RESTORED_PRODUCTS=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_restore_test -e "SELECT COUNT(*) FROM products;")
          SOURCE_PRODUCTS=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT COUNT(*) FROM products;")
          RESTORED_ORDERS=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_restore_test -e "SELECT COUNT(*) FROM purchase_orders WHERE id=$ORDER_ID;")
          RESTORED_ARCHIVE=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_restore_test -e "SELECT COUNT(*) FROM stock_movements_archive WHERE idempotency_key='ci-archive-entry-001';")

          test "$RESTORED_PRODUCTS" = "$SOURCE_PRODUCTS"
          test "$RESTORED_ORDERS" = "1"
          test "$RESTORED_ARCHIVE" = "1"

      - name: Verify concurrent FEFO exits cannot oversell
        shell: bash
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            INSERT INTO products(sku,name,category,current_stock,minimum_stock,active)
            VALUES('LOCK-001','Teste concorrência','Teste',0,0,TRUE);
          "
          PRODUCT_ID=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT id FROM products WHERE sku='LOCK-001';")
          mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
            CALL sp_stock_batch_entry($PRODUCT_ID,'LOT-LOCK',NULL,10,1,'ci','ci-lock-seed-001',@m,@b,@before,@after);
          "

          (
            set +e
            mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
              CALL sp_stock_exit_fefo($PRODUCT_ID,7,'ci','ci-lock-exit-a',@m,@before,@after);
            " >/tmp/exit-a.log 2>&1
            echo $? >/tmp/exit-a.code
          ) &
          PID_A=$!

          (
            set +e
            mysql -h 127.0.0.1 -uroot -proot nexo_test -e "
              CALL sp_stock_exit_fefo($PRODUCT_ID,7,'ci','ci-lock-exit-b',@m,@before,@after);
            " >/tmp/exit-b.log 2>&1
            echo $? >/tmp/exit-b.code
          ) &
          PID_B=$!

          wait "$PID_A"
          wait "$PID_B"

          STOCK=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT current_stock FROM products WHERE id=$PRODUCT_ID;")
          BATCH=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT quantity FROM stock_batches WHERE product_id=$PRODUCT_ID AND lot_code='LOT-LOCK';")
          EXITS=$(mysql -N -h 127.0.0.1 -uroot -proot nexo_test -e "SELECT COUNT(*) FROM stock_movements WHERE product_id=$PRODUCT_ID AND movement_type='EXIT';")
          CODE_A=$(cat /tmp/exit-a.code)
          CODE_B=$(cat /tmp/exit-b.code)

          test "$STOCK" = "3.000"
          test "$BATCH" = "3.000"
          test "$EXITS" = "1"

          if [ "$CODE_A" -eq 0 ] && [ "$CODE_B" -eq 0 ]; then
            echo "Both concurrent exits succeeded; expected one to be rejected."
            exit 1
          fi
